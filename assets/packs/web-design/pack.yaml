# released one. Installation requires --allow-unverified-pack or an explicit
# acknowledgment in the wizard. Native paths and integrity digests reflect the
# migration; pinned commits and absent evidence remain visible.
#
# The `verdict` values below are PLACEHOLDERS, following the convention the
# T004 fixture already uses. The schema requires a verdict enum and offers no
# null option, so there is no way to express "vendored, not yet adjudicated".
# No verdict here reflects any airlock adjudication. Airlock stays the sole
# system of record; when it runs, these values are replaced by derived ones.
# =========================================================================
