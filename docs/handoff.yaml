decisions:
  - date: 2026-09-30
    summary: >-
      Systems remediation separates merged personal settings from deletable core
      ownership; omitted opt-in flags retain prior choices. Local-core resources
      and roles never fall back to stale globals when required project files are
      missing. Report-only navigator uses explicit read-only native settings.
  - date: 2026-09-30
    summary: >-
      Falcon workers implement and test under workspace-write; steering alone
      audits scoped diffs/fresh reports and owns authorized commits, recovery and
      integration. Shared Linux/WSL subreaper/pidfd supervision requires explicit
      caller identity and durable shutdown proof before releasing scope or
      restoring web transactions. Corrupt/unowned state and failed restores are
      preserved for inspection, not silently treated as completion.
  - date: 2026-09-30
    summary: >-
      User approved one bounded authenticated smoke and normal /hooks review of
      only a disposable Stop handler. Both passed without personal installation,
      credential copying or personal trust changes. Stop findings are advisory
      UI warnings, not model context or automatic continuation. Keep manual QA
      fallback and web-design release-invalid status; no external release stamp.
  - date: 2026-09-30
    summary: >-
      Execute approved migration from sibling claude-bootstrap-protocol at
      f89f7f3dffb1150fa7df30b180b397dd25a711f9; preserve destination history and
      Beads. Global-first is default, local-core is self-contained, personal
      config/packs are opt-in and hook trust remains user-owned.
  - date: 2026-09-30
    summary: >-
      Keep web-design release-invalid with explicit unverified acknowledgment;
      digests/licenses do not substitute for absent adjudicated evidence.
      Falcon uses isolated local Codex workers and a stoppable monitor, no service.
  - date: 2026-09-30
    summary: >-
      CLI 0.159.2 generic spawning lacks a native role selector. Keep documented
      standalone TOML roles and provide a tested native exec-config compatibility
      loader; do not claim generic spawn applies TOML sandbox settings.
  - date: 2026-06-07
    summary: >-
      Minion is now dual-mode: report-only for analysis and guarded execution
      for explicit implementation requests. Fanout defaults to 6 workers and
      is hard-capped at 6; execution workers require disjoint write scopes and
      steering-session Beads, verification, commit, and push coordination.
  - date: 2026-06-07
    summary: >-
      The global minion skill and global worker agent TOML on this machine were
      synced from the repository copies after the executable minion update.
  - date: 2026-06-07
    summary: >-
      Bootstrap now accepts explicit --interactive and --non-interactive modes;
      CI and non-TTY invocations remain no-prompt non-interactive paths.
  - date: 2026-06-07
    summary: >-
      Converted the approved interactive bootstrap wizard plan into Beads:
