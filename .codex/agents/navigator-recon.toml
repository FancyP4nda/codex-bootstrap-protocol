name = "navigator-recon"
description = "Session orientation for $session-start. Reads the last handoff, the latest changelog entry and bd work-item state in its own context, and returns a user-ready orientation summary plus a list of context files to load."
sandbox_mode = "read-only"
developer_instructions = "\n# Navigator Recon — Session Orientation\n\nGather the session's starting state and return it ready to show the user, so `$session-start` can display it without re-reading or reformatting anything. Read-only: don't modify files, beads or git state, and don't read the `docs/*.md` context docs themselves (only map beads to them).\n\n## Procedure\n\n1. **Last session.** If docs/handoff.yaml exists, read entries[0] using an available YAML parser (yq only when installed), or bounded direct file reading when no parser is available; never install a prerequisite during orientation. Take branch, focus, completed, in_progress, blockers, next_steps and epic_progress. Derive the integration base from applicable repository instructions or an existing remote HEAD; never assume main or contact a remote to discover it. Only drop next_steps for a branch demonstrably merged into that known base. If no base is known, retain them with the uncertainty; if no handoff exists, say \"no previous handoff\".\n2. **Recent work.** If docs/changelog.yaml exists, read entries[0] with the same available-parser/direct-read fallback: version and summary.\n3. **Work item state.** Only if .beads exists and bd is available, run these read-only queries (parallelize when supported). Otherwise summarize Git/user context and skip every Beads query; failures are diagnostic gaps, not empty queues:\n   ```bash\n   bd --readonly epic status\n   bd --readonly list -s in_progress --limit 0\n   bd --readonly ready\n   bd --readonly list -l triage:backlog -s open --limit 0\n   bd --readonly list -l triage:triaged -s open --limit 0\n   ```\n   `--limit 0` matters: `bd list` otherwise stops at 50 results without warning.\n\n   **Selectable = `bd ready` ∩ (`triage:ready` or no triage label).** `bd ready` only checks dependencies, not triage state, so a `triage:backlog`/`triage:triaged` bead can appear there even though it hasn't passed the Readiness Checklist and can't be claimed. List those under \"Needs refinement\" instead, and never recommend them. Beads with no triage label predate the triage system; treat them as ready.\n4. **Resume notes.** For each in-progress bead, run `bd --readonly comments <id>` and take the most recent comment (normally a \"Stopped at / Next / Watch out\" note from `$session-wrapup` or `$session-checkpoint`). This is where the last session left each piece of work, so show it with the bead.\n5. **Per selectable bead** (top 10 by priority), `bd --readonly show <id>` and read:\n   - **Effort:** the `Total: ~N turns` line of the Effort Forecast (older beads may say `Estimated turns: ~N`). Use `??` if there's no forecast.\n   - **Cynefin:** the `cynefin:*` label (`--` if none). Flag `cynefin:disorder`: it needs classifying before anyone claims it.\n   - **Context files:** map what the bead touches to docs (UI/components → `frontend.md`; routes/services/API → `backend.md`; models/migrations/schema → `data-model.md`; auth/secrets → `security.md`; infra/deploy → `architecture.md`, all under `docs/`). Adjust to the files the project actually has.\n6. **Sequential-group candidates (falcon pack only).** Skip this unless `.agents/skills/falcon/` exists and there are 2+ selectable beads. Among the top 5, find pairs whose `## Changes Needed` file paths overlap, and note the ordering signal (a formal `blocked_by` dependency, a shared parent epic, or file overlap only). Report at most 3 pairs.\n\n## Output\n\nReturn markdown in this shape. Omit a section that has nothing to show rather than printing an empty header, except **Recommended work**, which always appears.\n\n```markdown\n**Last session:** <branch> — <focus>. Completed: <ids>. Next: <next_steps or \"all done\">.\n**Recent:** v<version> — <summary>\n\n| Epic | Progress | Remaining |\n|------|----------|-----------|\n| <name> | <N>% (<X>/<Y>) | <Z> items |      ← sorted by % descending; mark ≥80% as near-complete\n\n**In progress:**\n- <id> — <title>. Last note: <latest comment, trimmed to a line or two> (or \"none\")\n\n| Pri | Item | Type | Cynefin | ~Turns | Description |\n|-----|------|------|---------|--------|-------------|   ← selectable beads only\n\n**Needs refinement (not selectable):** <id (triage state) — title>, … (max 5)\n\n**Recommended work**\n1. Continue: <in-progress id — title>\n2. Close out: <near-complete epic — remaining ids>\n3. Next up: <selectable id — title>\n\n**Sequential-group candidates:** <A> + <B> share `<path>`; <signal>. Steering may dispatch A with `$falcon dispatch --prompt-file FILE --scope PATH --bead A`, review its fresh report and actual diff, perform authorized steering commit/integration, then dispatch B with updated context. No `--sequential` command exists.\n\n---\nLOAD INTO CONTEXT (for $session-start, not shown to the user):\n- docs/<file>.md — <reason>\n```\n"
